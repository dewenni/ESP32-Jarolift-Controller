<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Jarolift-Controller</title>
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="stylesheet" type="text/css" href="lib.css" />
    <link rel="stylesheet" type="text/css" href="user.css" />
    <script defer src="lib.js" defer></script>
    <script defer src="user.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header class="app-header">
      <strong class="app-brand">Jarolift-Controller</strong>
      <div class="app-modes">
        <span class="simModeBar">SIMULATION</span>
        <span class="setupModeBar">SETUP-MODE</span>
        <span id="errorBar" class="app-error" role="status" style="display: none"><span id="errorBarText"></span></span>
      </div>
      <div class="app-connection-actions">
      <span id="p00_web_connection" class="app-connection" role="status" aria-live="polite">
        <span id="p00_web_connection_text" data-i18n="ui_disconnected"></span>
      </span>
        <button id="p99_reloadButton" type="button" class="app-reload svg i_auto" data-ui-local aria-label="Reload" hidden></button>
      </div>
    </header>
    <dialog id="bitmask_dialog">
      <article class="dash">
        <div class="dash-main">
          <div class="dash-header" data-i18n="bitmask_wizard"></div>
          <br />
          <div>
            <!-- Checkbox channel- 1..16 -->
            <div class="leftright CH1">
              <label for="channel-0" id="bitmask_dialog_ch_0"> </label>
              <input type="checkbox" id="channel-0" data-bit="0" />
            </div>
            <div class="leftright CH2">
              <label for="channel-1" id="bitmask_dialog_ch_1"> </label>
              <input type="checkbox" id="channel-1" data-bit="1" />
            </div>
            <div class="leftright CH3">
              <label for="channel-2" id="bitmask_dialog_ch_2"> </label>
              <input type="checkbox" id="channel-2" data-bit="2" />
            </div>
            <div class="leftright CH4">
              <label for="channel-3" id="bitmask_dialog_ch_3"> </label>
              <input type="checkbox" id="channel-3" data-bit="3" />
            </div>
            <div class="leftright CH5">
              <label for="channel-4" id="bitmask_dialog_ch_4"> </label>
              <input type="checkbox" id="channel-4" data-bit="4" />
            </div>
            <div class="leftright CH6">
              <label for="channel-5" id="bitmask_dialog_ch_5"> </label>
              <input type="checkbox" id="channel-5" data-bit="5" />
            </div>
            <div class="leftright CH7">
              <label for="channel-6" id="bitmask_dialog_ch_6"> </label>
              <input type="checkbox" id="channel-6" data-bit="6" />
            </div>
            <div class="leftright CH8">
              <label for="channel-7" id="bitmask_dialog_ch_7"> </label>
              <input type="checkbox" id="channel-7" data-bit="7" />
            </div>
            <div class="leftright CH9">
              <label for="channel-8" id="bitmask_dialog_ch_8"> </label>
              <input type="checkbox" id="channel-8" data-bit="8" />
            </div>
            <div class="leftright CH10">
              <label for="channel-9" id="bitmask_dialog_ch_9"> </label>
              <input type="checkbox" id="channel-9" data-bit="9" />
            </div>
            <div class="leftright CH11">
              <label for="channel-10" id="bitmask_dialog_ch_10"> </label>
              <input type="checkbox" id="channel-10" data-bit="10" />
            </div>
            <div class="leftright CH12">
              <label for="channel-11" id="bitmask_dialog_ch_11"> </label>
              <input type="checkbox" id="channel-11" data-bit="11" />
            </div>
            <div class="leftright CH13">
              <label for="channel-12" id="bitmask_dialog_ch_12"> </label>
              <input type="checkbox" id="channel-12" data-bit="12" />
            </div>
            <div class="leftright CH14">
              <label for="channel-13" id="bitmask_dialog_ch_13"> </label>
              <input type="checkbox" id="channel-13" data-bit="13" />
            </div>
            <div class="leftright CH15">
              <label for="channel-14" id="bitmask_dialog_ch_14"> </label>
              <input type="checkbox" id="channel-14" data-bit="14" />
            </div>
            <div class="leftright CH16">
              <label for="channel-15" id="bitmask_dialog_ch_15"> </label>
              <input type="checkbox" id="channel-15" data-bit="15" />
            </div>
          </div>
          <br />
          <div class="dash-footer">
            <button
              id="apply_bitmask"
              data-i18n="apply"
              style="width: 75%"></button>
          </div>
          <div class="dash-footer">
            <button
              id="close_bitmask_dialog"
              data-i18n="cancel"
              style="width: 75%"></button>
          </div>
        </div>
        <div class="dash-icon">
          <div class="svg i_binary"></div>
        </div>
      </article>
    </dialog>
    <!-- Dialog Version -->

    <!-- Dialog OTA-FAILED -->
    <dialog id="ota_update_failed_dialog">
      <article class="dash">
        <div class="dash-main">
          <div class="dash-header" data-i18n="update_failed"></div>
          <div style="text-align: center">
            <span data-i18n="error_text"></span>
            <span id="p00_ota_upd_err"></span>
          </div>
          <div class="dash-content">
            <p data-i18n="update_error_info"></p>
          </div>
          <div class="dash-footer">
            <button
              id="p00_ota_failed_btn"
              data-i18n="ok"
              style="width: 75%"></button>
          </div>
        </div>
        <div class="dash-icon">
          <div class="svg i_alarm"></div>
        </div>
      </article>
    </dialog>
    <!-- Dialog OTA-Done -->
    <dialog id="ota_update_done_dialog">
      <article class="dash">
        <div class="dash-main">
          <div class="dash-header" data-i18n="update_done"></div>
          <div class="dash-content">
            <p data-i18n="update_info"></p>
          </div>
          <div class="dash-footer">
            <button
              id="p00_ota_confirm_btn"
              data-i18n="restart"
              style="width: 75%"></button>
          </div>
        </div>
        <div class="dash-icon">
          <div class="svg i_update_done"></div>
        </div>
      </article>
    </dialog>
    <!--TOP-MENU-->
    <nav>
      <div class="topMenu">
        <ul>
          <li>
            <strong class="app-brand">Jarolift-Controller</strong>
          </li>
        </ul>
        <div class="app-modes">
          <span class="simModeBar">SIM</span>
          <span class="setupModeBar">SETUP</span>
        </div>
        <ul>
          <li>
            <details class="dropdown">
              <summary id="topMenuDropdown" aria-label="Navigation">
                <i class="svg i_menu" aria-hidden="true"></i>
              </summary>
              <ul class="nav-list"><li><a data-tab="tab1" href="#" data-i18n="channels"></a></li>
<li><a data-tab="tab2" href="#" data-i18n="groups"></a></li>
<li><a data-tab="tab3" href="#" data-i18n="timer"></a></li>
<li><a data-tab="tab4" href="#" data-i18n="service"></a></li>
<li><a data-tab="tab9" href="#" data-i18n="system"></a></li>
<li><a data-tab="tab10" href="#" data-i18n="logger"></a></li>
<li><a data-tab="tab11" href="#" data-i18n="tools"></a></li>
<li><a data-tab="tab12" href="#" data-i18n="settings"></a></li>
<li><a data-tab="tab13" href="#" data-i18n="help"></a></li></ul>
            </details>
          </li>
        </ul>
      </div>
    </nav>
    <!--TOP-MENU-END-->
    <!--SIDEBAR-->
    <div class="sidebar">
      <ul class="nav-list"><li><a href="#" data-tab="tab1" class="active"><span class="links_name" data-i18n="channels"></span></a></li>
<li><a href="#" data-tab="tab2"><span class="links_name" data-i18n="groups"></span></a></li>
<li><a href="#" data-tab="tab3"><span class="links_name" data-i18n="timer"></span></a></li>
<li><a href="#" data-tab="tab4"><span class="links_name" data-i18n="service"></span></a></li>
<li><a href="#" data-tab="tab9"><span class="links_name" data-i18n="system"></span></a></li>
<li><a href="#" data-tab="tab10"><span class="links_name" data-i18n="logger"></span></a></li>
<li><a href="#" data-tab="tab11"><span class="links_name" data-i18n="tools"></span></a></li>
<li><a href="#" data-tab="tab12"><span class="links_name" data-i18n="settings"></span></a></li>
<li><a href="#" data-tab="tab13"><span class="links_name" data-i18n="help"></span></a></li></ul>
      <div class="sidebar-status">
        <button type="button" id="p00_version" class="sidebar-version" data-ui-local aria-controls="tab11"></button>
        <i id="p00_wifi_icon" role="img"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="wifi-outer" d="M3 8a14 14 0 0 1 18 0"/><path class="wifi-middle" d="M6 11.5a9 9 0 0 1 12 0"/><path class="wifi-inner" d="M9 15a4.6 4.6 0 0 1 6 0"/><circle class="wifi-dot" cx="12" cy="19" r="0.8"/></svg></i>
        <i id="p00_eth_icon" role="img"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v11h-3v4H9v-4H6zM9 3v4m3-4v4m3-4v4M12 18v3M8 21h8"/></svg></i>
        <a href="/logout" class="sidebar-logout OPT_AUTH" aria-label="Abmelden" title="Abmelden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4H5v16h9M10 12h11m-4-4 4 4-4 4"/></svg></a>
      </div>
    </div>
    <!--Sidebar-END-->
    <section class="home-section">
      <main class="container-fluid">
        <!--SECTION-END-->
      </main>
    </section>
  </body>
</html>
