<!doctype html>
<html data-theme="dark">
  <head>
    <title>ESP Async Web Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../css/pico.css" />
    <link rel="stylesheet" type="text/css" href="../css/custom.css" />
    <link rel="stylesheet" type="text/css" href="../css/icons.css" />
    <script src="../js/doc.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <script src="../js/fun.js" defer></script>
    <script src="../js/events.js" defer></script>
    <style></style>
    <script>
      function test() {
        document.getElementById("tab12").classList.add("active");
        localizePage("de");
      }
      setInterval(test, 1000);
    </script>
  </head>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
<div id="tab12" class="tab-content"><header class="page-heading"><h1 data-i18n="settings"></h1><p data-i18n="settings_subtitle"></p></header>
<div class="settings-layout" data-settings data-settings-layout="tabs">
    <div class="settings-body">
      <aside class="settings-category-nav" aria-labelledby="p12_settings_area_label">
        <label class="settings-category-picker">
          <span id="p12_settings_area_label" data-i18n="settings_area"></span>
          <select id="p12_settings_area" data-settings-select data-ui-local></select>
        </label>
        <div class="settings-category-list" data-settings-list></div>
      </aside>
      <div class="settings-panels" data-connection-required>
        <section id="p12_settings_general" class="settings-panel" data-settings-group="general" data-settings-label="settings_general"><h2 data-i18n="settings_general"></h2>
<details name="settings-general">
              <summary data-i18n="language"></summary>
              <select id="cfg_lang">
                <option value="0" data-i18n="german"></option>
                <option value="1" data-i18n="english"></option>
              </select>
            </details>
<details name="settings-general">
              <summary data-i18n="ntp"></summary>
              <div class="section-header">
                <label for="cfg_ntp_enable" data-i18n="activate"></label>
                <div class="switch-container">
                  <input
                    name="ntp_enable"
                    type="checkbox"
                    role="switch"
                    id="cfg_ntp_enable" />
                </div>
              </div>
              <br />
              <label for="cfg_ntp_server" data-i18n="server"></label>
              <input type="text" id="cfg_ntp_server" name="ntp_server" />
              <div class="leftright">
                <label for="cfg_ntp_tz" data-i18n="ntp_tz"></label>
                <button
                  id="p12_ntp_open_dialog_btn"
                  class="i_help"
                  style="
                    height: 20px;
                    background-color: transparent;
                    border: none;
                  "></button>
              </div>
              <input type="text" id="cfg_ntp_tz" name="time_zone" />
            </details>
<details name="settings-general">
              <summary data-i18n="geo_location"></summary>
              <br />
              <div class="settings-fields"><div class="settings-field settings-field--medium"><label for="cfg_geo_latitude" data-i18n="latitude"></label><input type="number" id="cfg_geo_latitude" name="latitude" /></div>
              <div class="settings-field settings-field--medium"><label for="cfg_geo_longitude" data-i18n="longitude"></label><input type="number" id="cfg_geo_longitude" name="longitude" /></div>
              </div><div class="info-box">
                <div class="info-icon">&#9432;</div>
                <div class="info-text" data-i18n="geo_info"></div>
              </div>
            </details>
</section>
<section id="p12_settings_network" class="settings-panel" data-settings-group="network" data-settings-label="settings_network"><h2 data-i18n="settings_network"></h2>
<details name="settings-network">
              <summary data-i18n="wifi"></summary>
              <div class="section-header">
                <label for="cfg_wifi_enable" data-i18n="activate"></label>
                <div class="switch-container">
                  <input
                    name="wifi_enable"
                    type="checkbox"
                    role="switch"
                    id="cfg_wifi_enable" />
                </div>
              </div>
              <br />
              <label for="cfg_wifi_hostname" data-i18n="hostname"></label>
              <input type="text" id="cfg_wifi_hostname" name="wifi_hostname" />
              <label for="cfg_wifi_ssid" data-i18n="ssid"></label>
              <fieldset role="group">
                <input
                  type="text"
                  id="cfg_wifi_ssid"
                  aria-describedby="p12_wifi_ssid_hint"
                  name="wifi_ssid"
                  style="min-width: 0" />
                <button
                  type="button"
                  id="p12_wifi_ssid_scan_btn"
                  data-i18n="wifi_ssid_search"
                  style="white-space: nowrap; flex: 0 0 auto"></button>
              </fieldset>
              <small id="p12_wifi_ssid_hint" data-i18n="wifi_ssid_hint"></small>
              <dialog
                id="p12_wifi_ssid_dialog"
                aria-labelledby="p12_wifi_ssid_title">
                <article style="width: min(48rem, 95vw)">
                  <header
                    id="p12_wifi_ssid_title"
                    data-i18n="wifi_ssid_title"></header>
                  <p
                    id="p12_wifi_ssid_status"
                    role="status"
                    aria-live="polite"></p>
                  <label
                    for="p12_wifi_ssid_list"
                    data-i18n="wifi_ssid_select"></label>
                  <select
                    id="p12_wifi_ssid_list"
                    size="6"
                    style="width: 100%"></select>
                  <footer>
                    <button
                      type="button"
                      id="p12_wifi_ssid_retry_btn"
                      data-i18n="wifi_ap_retry"></button>
                    <button
                      type="button"
                      id="p12_wifi_ssid_apply_btn"
                      data-i18n="wifi_ap_apply"></button>
                    <button
                      type="button"
                      id="p12_wifi_ssid_close_btn"
                      class="secondary"
                      data-i18n="close"></button>
                  </footer>
                </article>
              </dialog>
              <label for="cfg_wifi_password">Passwort</label>
              <input
                type="password"
                id="cfg_wifi_password"
                name="wifi_password" />

              <label for="cfg_wifi_bssid" data-i18n="wifi_ap_bssid"></label>
              <fieldset role="group">
                <input
                  type="text"
                  id="cfg_wifi_bssid"
                  aria-describedby="p12_wifi_ap_hint"
                  name="wifi_bssid"
                  placeholder="AA:BB:CC:DD:EE:FF"
                  maxlength="17"
                  oninput="validateWiFiBssid(this)"
                  style="min-width: 0" />
                <button
                  type="button"
                  id="p12_wifi_ap_scan_btn"
                  data-i18n="wifi_ap_search"
                  style="white-space: nowrap; flex: 0 0 auto"></button>
              </fieldset>
              <small id="p12_wifi_ap_hint" data-i18n="wifi_ap_hint"></small>
              <span id="p12_wifi_ap_results" hidden></span>

              <dialog
                id="p12_wifi_ap_dialog"
                aria-labelledby="p12_wifi_ap_title">
                <article style="width: min(48rem, 95vw)">
                  <header
                    id="p12_wifi_ap_title"
                    data-i18n="wifi_ap_title"></header>
                  <p>
                    <span data-i18n="ssid"></span>:
                    <strong id="p12_wifi_ap_ssid"></strong>
                  </p>
                  <p
                    id="p12_wifi_ap_status"
                    role="status"
                    aria-live="polite"></p>
                  <label
                    for="p12_wifi_ap_list"
                    data-i18n="wifi_ap_select"></label>
                  <select
                    id="p12_wifi_ap_list"
                    size="6"
                    style="width: 100%"></select>
                  <footer>
                    <button
                      type="button"
                      id="p12_wifi_ap_retry_btn"
                      data-i18n="wifi_ap_retry"></button>
                    <button
                      type="button"
                      id="p12_wifi_ap_apply_btn"
                      data-i18n="wifi_ap_apply"></button>
                    <button
                      type="button"
                      id="p12_wifi_ap_close_btn"
                      class="secondary"
                      data-i18n="close"></button>
                  </footer>
                </article>
              </dialog>

              <div class="section-header">
                <label for="cfg_wifi_static_ip" data-i18n="static_ip"></label>
                <div class="switch-container">
                  <input
                    name="man_ip_enable"
                    type="checkbox"
                    role="switch"
                    hideOpt="WIFI_STATIC_IP"
                    id="cfg_wifi_static_ip" />
                </div>
              </div>
              <br />
              <div class="WIFI_STATIC_IP">
                <label for="cfg_wifi_ipaddress" data-i18n="ip_adr"></label>
                <input
                  type="url"
                  data-type="ip"
                  oninput="validateIP(this)"
                  id="cfg_wifi_ipaddress"
                  name="ip_adr" />
                <label for="cfg_wifi_subnet" data-i18n="ip_subnet"></label>
                <input
                  type="url"
                  data-type="ip"
                  oninput="validateIP(this)"
                  id="cfg_wifi_subnet"
                  name="ip_subnet" />
                <label for="cfg_wifi_gateway" data-i18n="ip_gateway"></label>
                <input
                  type="url"
                  data-type="ip"
                  oninput="validateIP(this)"
                  id="cfg_wifi_gateway"
                  name="ip_gateway" />
                <label for="cfg_wifi_dns" data-i18n="ip_dns"></label>
                <input
                  type="url"
                  data-type="ip"
                  oninput="validateIP(this)"
                  id="cfg_wifi_dns"
                  name="ip_dns" />
              </div>
            </details>
<details name="settings-network">
              <summary>Ethernet (W5500)</summary>
              <div class="section-header">
                <label for="cfg_eth_enable" data-i18n="activate"></label>
                <div class="switch-container">
                  <input
                    name="eth_enable"
                    type="checkbox"
                    role="switch"
                    id="cfg_eth_enable" />
                </div>
              </div>
              <br />
              <label for="cfg_eth_hostname" data-i18n="hostname"></label>
              <input type="text" id="cfg_eth_hostname" name="eth_hostname" />
              <div class="settings-fields"><div class="settings-field settings-field--compact"><label for="cfg_eth_gpio_sck">GPIO CLK</label><input type="number" id="cfg_eth_gpio_sck" name="eth_gpio_sck" /></div>
              <div class="settings-field settings-field--compact"><label for="cfg_eth_gpio_mosi">GPIO MOSI</label><input
                type="number"
                id="cfg_eth_gpio_mosi"
                name="eth_gpio_mosi" /></div>
              <div class="settings-field settings-field--compact"><label for="cfg_eth_gpio_miso">GPIO MISO</label><input
                type="number"
                id="cfg_eth_gpio_miso"
                name="eth_gpio_miso" /></div>
              <div class="settings-field settings-field--compact"><label for="cfg_eth_gpio_cs">GPIO CS</label><input type="number" id="cfg_eth_gpio_cs" name="eth_gpio_cs" /></div>
              <div class="settings-field settings-field--compact"><label for="cfg_eth_gpio_irq">GPIO INT</label><input type="number" id="cfg_eth_gpio_irq" name="eth_gpio_irq" /></div>
              <div class="settings-field settings-field--compact"><label for="cfg_eth_gpio_rst">GPIO RST</label><input type="number" id="cfg_eth_gpio_rst" name="eth_gpio_rst" /></div>
              </div><div class="section-header">
                <label for="cfg_wifi_static_ip" data-i18n="static_ip"></label>
                <div class="switch-container">
                  <input
                    name="man_ip_enable"
                    type="checkbox"
                    role="switch"
                    hideOpt="ETH_STATIC_IP"
                    id="cfg_eth_static_ip" />
                </div>
              </div>
              <br />
              <div class="ETH_STATIC_IP">
                <label for="cfg_wifi_ipaddress" data-i18n="ip_adr"></label>
                <input
                  type="url"
                  data-type="ip"
                  oninput="validateIP(this)"
                  id="cfg_eth_ipaddress"
                  name="ip_adr" />
                <label for="cfg_wifi_subnet" data-i18n="ip_subnet"></label>
                <input
                  type="url"
                  data-type="ip"
                  oninput="validateIP(this)"
                  id="cfg_eth_subnet"
                  name="ip_subnet" />
                <label for="cfg_wifi_gateway" data-i18n="ip_gateway"></label>
                <input
                  type="url"
                  data-type="ip"
                  oninput="validateIP(this)"
                  id="cfg_eth_gateway"
                  name="ip_gateway" />
                <label for="cfg_wifi_dns" data-i18n="ip_dns"></label>
                <input
                  type="url"
                  data-type="ip"
                  oninput="validateIP(this)"
                  id="cfg_eth_dns"
                  name="ip_dns" />
              </div>
            </details>
</section>
<section id="p12_settings_integrations" class="settings-panel" data-settings-group="integrations" data-settings-label="settings_integrations"><h2 data-i18n="settings_integrations"></h2>
<details id="p12_mqtt_settings" name="settings-integrations">
              <summary data-i18n="mqtt"></summary>
              <div class="section-header">
                <label for="cfg_mqtt_enable" data-i18n="activate"></label>
                <div class="switch-container">
                  <input
                    name="mqtt_enable"
                    type="checkbox"
                    role="switch"
                    id="cfg_mqtt_enable" />
                </div>
              </div>

              <br />
              <div role="group">
                <button
                  type="button"
                  id="p12_mqtt_test_btn"
                  style="white-space: nowrap; flex: 0 0 auto"
                  data-i18n="mqtt_connection_test"></button>
                <input
                  type="text"
                  id="p12_mqtt_connection"
                  style="height: auto; min-width: 0"
                  aria-label="MQTT connection status"
                  value="---"
                  disabled />
              </div>
              <span id="p12_mqtt_connection_state" hidden></span>
              <label for="cfg_mqtt_server" data-i18n="server"></label>
              <input
                type="text"
                oninput="validateHost(this)"
                id="cfg_mqtt_server"
                name="mqtt_server" />
              <label for="cfg_mqtt_port" data-i18n="port"></label>
              <input type="text" id="cfg_mqtt_port" name="mqtt_port" />
              <label for="cfg_mqtt_topic" data-i18n="topic"></label>
              <input type="text" id="cfg_mqtt_topic" name="mqtt_topic" />
              <label for="cfg_mqtt_user" data-i18n="user"></label>
              <input type="text" id="cfg_mqtt_user" name="mqtt_user" />
              <label for="cfg_mqtt_password" data-i18n="password"></label>
              <input
                type="password"
                id="cfg_mqtt_password"
                name="mqtt_password" />
</details>
<details id="p12_ha_settings" name="settings-integrations">
              <summary>Home Assistant</summary>
              <div class="section-header">
                <label for="cfg_mqtt_ha_enable" data-i18n="activate"></label>
                <input
                  name="mqtt_ha_enable"
                  type="checkbox"
                  role="switch"
                  id="cfg_mqtt_ha_enable" />
              </div>
              <p><small data-i18n="ha_mqtt_hint"></small></p>
              <p id="p12_ha_mqtt_warning" hidden>
                <small><span data-i18n="ha_mqtt_disabled"></span> <a href="#p12_mqtt_settings" id="p12_ha_mqtt_link" data-i18n="ha_mqtt_open"></a></small>
              </p>
              <label for="cfg_mqtt_ha_topic">Home Assistant Topic</label>
              <input
                type="text"
                id="cfg_mqtt_ha_topic"
                placeholder="homeassistant"
                name="mqtt_ha_topic" />
              <label for="cfg_mqtt_ha_device">Home Assistant Device Name</label>
              <input
                type="text"
                id="cfg_mqtt_ha_device"
                placeholder="jarolift"
                name="mqtt_ha_device" />
            </details>
<details name="settings-integrations">
              <summary data-i18n="homee"></summary>
              <div class="section-header">
                <label for="cfg_homee_enable" data-i18n="activate"></label>
                <div class="switch-container">
                  <input
                    name="homee_enable"
                    type="checkbox"
                    role="switch"
                    id="cfg_homee_enable" />
                </div>
              </div>
              <div class="info-box">
                <div class="info-icon">&#9432;</div>
                <div class="info-text" data-i18n="info_homee_integration"></div>
              </div>
              <br />
              <div class="section-header">
                <label
                  for="cfg_homee_third_position"
                  data-i18n="homee_third_position"></label>
                <div class="switch-container">
                  <input
                    name="homee_third_position"
                    type="checkbox"
                    role="switch"
                    id="cfg_homee_third_position" />
                </div>
              </div>
              <div class="info-box">
                <div class="info-icon">&#9432;</div>
                <div
                  class="info-text"
                  data-i18n="info_homee_third_position"></div>
              </div>
              <br />
              <label for="p12_homee_name" data-i18n="homee_virtual_name"></label>
              <input
                type="text"
                id="p12_homee_name"
                name="homee_name"
                disabled />
            </details>
</section>
<section id="p12_settings_device" class="settings-panel" data-settings-group="device" data-settings-label="settings_device"><h2 data-i18n="settings_device"></h2>
<details class="settings-card" name="settings-device"><summary data-i18n="pos_title"></summary>
  <div class="section-header"><label for="cfg_position_enable" data-i18n="pos_enable"></label><div class="switch-container"><input type="checkbox" role="switch" id="cfg_position_enable" /></div></div>
  <p class="info-text" data-i18n="pos_settings_hint"></p>
</details>
<details name="settings-device">
              <summary>JAROLIFT</summary>
              <div class="section-header">
                <label for="learn_mode" data-i18n="learn_mode"></label>
                <div class="switch-container">
                  <input
                    type="checkbox"
                    role="switch"
                    id="cfg_jaro_learn_mode" />
                </div>
              </div>
              <div class="info-box">
                <div class="info-icon">&#9432;</div>
                <div class="info-text" data-i18n="info_leanmode"></div>
              </div>
              <br />
              <label for="cfg_jaro_masterMSB">master MSB (HEX-Format)</label>
              <div class="row">
                <input
                  name="master_MSB"
                  type="text"
                  data-type="hex"
                  data-length="8"
                  id="cfg_jaro_masterMSB"
                  oninput="validateHex(this)"
                  pattern="[0-9a-fA-F]{1,8}"
                  title="Enter up to 8 HEX digits"
                  maxlength="8"
                  onblur="formatHex(this)"
                  disabled />
                <button
                  id="editBtn"
                  onclick="toggleEdit(this, 'cfg_jaro_masterMSB')">
                  Edit
                </button>
              </div>
              <label for="cfg_jaro_masterLSB">master LSB (HEX-Format)</label>
              <div class="row">
                <input
                  name="master_LSB"
                  type="text"
                  data-type="hex"
                  data-length="8"
                  id="cfg_jaro_masterLSB"
                  oninput="validateHex(this)"
                  pattern="[0-9a-fA-F]{1,8}"
                  title="Enter up to 8 HEX digits"
                  maxlength="8"
                  onblur="formatHex(this)"
                  disabled />
                <button
                  id="editBtn"
                  onclick="toggleEdit(this, 'cfg_jaro_masterLSB')">
                  Edit
                </button>
              </div>
              <br />
              <label for="cfg_jaro_serial" data-i18n="serial_nr++ (HEX-Format)"></label>
              <div class="row">
                <input
                  name="serial"
                  type="text"
                  data-type="hex"
                  data-length="6"
                  id="cfg_jaro_serial"
                  pattern="[0-9a-fA-F]{1,6}"
                  title="Enter up to 6 HEX digits"
                  onblur="if (/^[0-9a-fA-F]{1,6}$/.test(this.value)) formatHex(this)"
                  disabled />
                <button
                  id="editBtn"
                  onclick="toggleEdit(this, 'cfg_jaro_serial')">
                  Edit
                </button>
              </div>
              <div class="info-box">
                <div class="info-icon">&#9432;</div>
                <div class="info-text" data-i18n="info_serial"></div>
              </div>
              <br />
              <label for="p12_jaro_devcnt">Device Counter</label>
              <div class="row">
                <input
                  name="devcnt"
                  type="number"
                  id="p12_jaro_devcnt"
                  disabled />
                <button
                  id="editBtn"
                  onclick="toggleEdit(this, 'p12_jaro_devcnt')">
                  Edit
                </button>
              </div>
              <div class="info-box">
                <div class="info-icon">&#9432;</div>
                <div class="info-text" data-i18n="info_devcnt"></div>
              </div>
              <br />
            </details>
<details name="settings-device">
              <summary data-i18n="shutter"></summary>
              <br />
              <div class="info-box">
                <div class="info-icon">&#9432;</div>
                <div class="info-text" data-i18n="info_shutters"></div>
              </div>
              <br />
              <div class="row">
                <label for="cfg_jaro_ch_name_0" data-i18n="channel++ 1"></label>
                <input
                  name="shutter1"
                  type="text"
                  id="cfg_jaro_ch_name_0"
                  data-sync="p01_jaro_ch_name_0, bitmask_dialog_ch_0, p04_shutter_name_0"
                  placeholder="name" />
                <div>
                  <button id="p12_unlearn_0" data-i18n="unlearn"></button>
                </div>
                <div>
                  <button id="p12_learn_0" data-i18n="learn"></button>
                </div>
                <div>
                  <input
                    type="checkbox"
                    role="switch"
                    hideOpt="CH1"
                    id="cfg_jaro_ch_enable_0" />
                </div>
              </div>
              <div class="row">
                <label for="cfg_jaro_ch_name_1" data-i18n="channel++ 2"></label>
                <input
                  name="shutter2"
                  type="text"
                  id="cfg_jaro_ch_name_1"
                  data-sync="p01_jaro_ch_name_1, bitmask_dialog_ch_1, p04_shutter_name_1"
                  placeholder="name" />
                <div>
                  <button id="p12_unlearn_1" data-i18n="unlearn"></button>
                </div>
                <div>
                  <button id="p12_learn_1" data-i18n="learn"></button>
                </div>
                <div>
                  <input
                    type="checkbox"
                    role="switch"
                    hideOpt="CH2"
                    id="cfg_jaro_ch_enable_1" />
                </div>
              </div>
              <div class="row">
                <label for="cfg_jaro_ch_name_2" data-i18n="channel++ 3"></label>
                <input
                  name="shutter3"
                  type="text"
                  id="cfg_jaro_ch_name_2"
                  data-sync="p01_jaro_ch_name_2, bitmask_dialog_ch_2, p04_shutter_name_2"
                  placeholder="name" />
                <div>
                  <button id="p12_unlearn_2" data-i18n="unlearn"></button>
                </div>
                <div>
                  <button id="p12_learn_2" data-i18n="learn"></button>
                </div>
                <div>
                  <input
                    type="checkbox"
                    role="switch"
                    hideOpt="CH3"
                    id="cfg_jaro_ch_enable_2" />
                </div>
              </div>
              <div class="row">
                <label for="cfg_jaro_ch_name_3" data-i18n="channel++ 4"></label>
                <input
                  name="shutter4"
                  type="text"
                  id="cfg_jaro_ch_name_3"
                  data-sync="p01_jaro_ch_name_3, bitmask_dialog_ch_3, p04_shutter_name_3"
                  placeholder="name" />
                <div>
