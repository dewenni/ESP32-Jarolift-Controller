<!DOCTYPE html>
<html>
  <head>
    <title>ESP Async Web Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../css/pico.css" />
    <link rel="stylesheet" type="text/css" href="../css/custom.css" />
    <link rel="stylesheet" type="text/css" href="../css/icons.css" />
    <script src="../js/fun.js" defer></script>
    <script src="../js/doc.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <style></style>
    <script>
      function test() {
        document.getElementById("tab4").classList.add("active");
        localizePage("de");
      }
      setInterval(test, 1000);
    </script>
  </head>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
<div id="tab4" class="tab-content jarolift-page jarolift-service" data-connection-required>
  <header class="page-heading"><h1 data-i18n="service"></h1><p data-i18n="jaro_service_subtitle"></p></header>
  <div class="jarolift-service-grid">
    <article class="service-card service-setup" id="p04_service_setup">
      <div class="service-select"><label for="p04_selected_shutter" data-i18n="shutter"></label><select id="p04_selected_shutter" name="selected_shutter">
                <option class="CH1" value="0" id="p04_shutter_name_0"></option>
                <option class="CH2" value="1" id="p04_shutter_name_1"></option>
                <option class="CH3" value="2" id="p04_shutter_name_2"></option>
                <option class="CH4" value="3" id="p04_shutter_name_3"></option>
                <option class="CH5" value="4" id="p04_shutter_name_4"></option>
                <option class="CH6" value="5" id="p04_shutter_name_5"></option>
                <option class="CH7" value="6" id="p04_shutter_name_6"></option>
                <option class="CH8" value="7" id="p04_shutter_name_7"></option>
                <option class="CH9" value="8" id="p04_shutter_name_8"></option>
                <option class="CH10" value="9" id="p04_shutter_name_9"></option>
                <option
                  class="CH11"
                  value="10"
                  id="p04_shutter_name_10"></option>
                <option
                  class="CH12"
                  value="11"
                  id="p04_shutter_name_11"></option>
                <option
                  class="CH13"
                  value="12"
                  id="p04_shutter_name_12"></option>
                <option
                  class="CH14"
                  value="13"
                  id="p04_shutter_name_13"></option>
                <option
                  class="CH15"
                  value="14"
                  id="p04_shutter_name_14"></option>
                <option
                  class="CH16"
                  value="15"
                  id="p04_shutter_name_15"></option>
              </select></div>
      <div class="service-setup-body">
        <section class="service-commands">
          <h2 data-i18n="service_cmds"></h2>
          <div class="dash-content service-drive">
            <button id="p04_up" class="svgbtn i_up" aria-label="Up"></button>
            <button id="p04_stop" class="svgbtn i_stop" aria-label="Stop"></button>
            <button id="p04_down" class="svgbtn i_down" aria-label="Down"></button>
            <button id="p04_shade" class="svgbtn i_shade" aria-label="Shade"></button>
          </div>
          <hr />
          <button id="p04_cmd_set_shade" data-i18n="set_shade" class="svgbtn2 i_shade"></button>
          <hr />
          <div class="service-command-pair">
            <button class="svgbtn2 i_end_up" id="p04_cmd_end_up_set" data-i18n="cmd_endpoint_up$ $set"></button>
            <button class="svgbtn2 i_end_down" id="p04_cmd_end_down_set" data-i18n="cmd_endpoint_down$ $set"></button>
          </div>
          <hr />
          <div class="service-command-pair">
            <button class="svgbtn2 i_end_up_bin" id="p04_cmd_end_up_delete" data-i18n="cmd_endpoint_up$ $delete"></button>
            <button class="svgbtn2 i_end_down_bin" id="p04_cmd_end_down_delete" data-i18n="cmd_endpoint_down$ $delete"></button>
          </div>
        </section>
        <section class="position-service">
          <div id="p04_position_intro">
            <div class="position-intro-copy">
            <h2 data-i18n="pos_calibration"></h2>
            <p id="p04_position_summary" class="position-status" aria-live="polite"></p>
            <p class="info-text" data-i18n="pos_service_hint"></p>
            <div class="position-brief">
              <div><strong>↑ <span data-i18n="pos_up"></span></strong><p data-i18n="pos_lift$ · $pos_half$ · $pos_full_open"></p></div>
              <div><strong>↓ <span data-i18n="pos_down"></span></strong><p data-i18n="pos_half$ · $pos_bottom$ · $pos_full_closed"></p></div>
            </div>
            <details class="position-help"><summary data-i18n="pos_notes"></summary><p class="info-text" data-i18n="pos_remote_hint"></p></details>
            </div>
            <div class="position-actions"><button type="button" data-ui-local id="p04_position_begin" data-i18n="pos_calibrate"></button></div>
          </div>
          <div id="p04_position_inline"></div>
          <p class="info-text" id="p04_position_notice" role="status"></p>
        </section>
      </div>

      <section class="remote-mapping-service">
        <div class="remote-mapping-toolbar"><h2 data-i18n="remotes"></h2><span id="remote_mapping_count"></span><button type="button" id="remote_mapping_add" data-ui-local data-i18n="rm_add"></button></div>
        <p class="info-text" data-i18n="rm_info"></p>
        <div id="remote_mapping_rows"></div>
        <p id="remote_mapping_empty" class="info-text" data-i18n="rm_empty"></p>
        <p id="remote_mapping_notice" role="status" aria-live="polite"></p>
      </section>
    </article>
  </div>
</div>
<dialog id="p04_position_dialog" aria-labelledby="p04_position_title">
 <article class="position-dialog">
  <header><small id="p04_position_channel"></small><h2 id="p04_position_title" data-i18n="pos_calibration"></h2></header>
  <div id="p04_position_steps" class="position-steps"></div>
  <div id="p04_position_body"></div>
  <footer class="position-actions"><button type="button" data-ui-local class="secondary" id="p04_position_cancel" data-i18n="pos_cancel"></button><button type="button" data-ui-local id="p04_position_next"></button></footer>
 </article>
</dialog>

<div hidden id="remote_mapping_config"></div>
<dialog id="remote_mapping_dialog" aria-labelledby="remote_mapping_title"><article>
  <header><small id="remote_mapping_channel"></small><h2 id="remote_mapping_title" data-i18n="rm_title"></h2></header>
  <p id="remote_mapping_steps"></p>
  <p id="remote_mapping_phase"></p>
  <p class="info-text" data-i18n="rm_warning"></p>
  <output id="remote_mapping_signal"></output>
  <button type="button" id="remote_mapping_retry" data-ui-local data-i18n="rm_retry"></button>
  <label for="remote_mapping_name" data-i18n="name"></label><input id="remote_mapping_name" type="text" autocomplete="off" disabled />
  <p id="remote_mapping_shared" class="info-text" data-i18n="rm_shared" hidden></p>
  <p id="remote_mapping_dialog_notice" role="status" aria-live="polite"></p>
  <footer><button type="button" id="remote_mapping_close" data-ui-local data-i18n="rm_close"></button><button type="button" id="remote_mapping_save" data-ui-local data-i18n="rm_save" disabled></button></footer>
</article></dialog>
<!--SECTION-END-->
    </main>
    <!-- Footer -->
    <footer
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
      <div id="status">STATUS</div>
    </footer>
  </body>
</html>
